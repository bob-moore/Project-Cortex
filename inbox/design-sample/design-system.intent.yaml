name: Canvas Intrinsic Design Sample
version: sample-0.1
purpose: >
  Communicate the design logic behind Canvas sizing to design agents without
  tying the system to WordPress, Astro, or any other runtime.

principles:
  - Intrinsic design: choose context-appropriate scales with min/max guardrails.
  - No breakpoint-first sizing: fluid tokens already contain viewport guardrails.
  - Selection logic matters more than raw values.
  - Prose remains readable even inside large display sections.

scaleRecipes:
  compactType:
    ratio: 1.125
    ratioName: Major Second
    fluid: false
    purpose: Reading surfaces, interface controls, cards, forms, and blog content.

  displayType:
    minRatio: 1.125
    minRatioName: Major Second
    maxRatio: 1.25
    maxRatioName: Major Third
    fluid: true
    method: clamp(min, viewport interpolation, max)
    purpose: Full-width page sections, heroes, and marketing headings.

  compactSpace:
    ratio: 1.125
    fluid: false
    purpose: Inline gaps, local rhythm, card internals, form spacing.

  displaySpace:
    minRatio: 1.125
    maxRatio: 1.25
    fluid: true
    method: clamp(min, viewport interpolation, max)
    purpose: Section padding, hero rhythm, and major page separation.

usageLanes:
  prose:
    typeScale: compactType
    spaceScale: compactSpace
    measure: 60ch-75ch
    examples:
      - Blog post body
      - FAQ answers
      - Body copy columns
      - Long-form resource pages
    rule: Use static reading sizes and ch-based measure.

  interface:
    typeScale: compactType
    spaceScale: compactSpace
    measure: component-defined
    examples:
      - Buttons
      - Forms
      - Navigation
      - Cards
    rule: Keep local rhythm tight and predictable.

  section:
    typeScale: displayType
    spaceScale: displaySpace
    measure: layout-dependent
    examples:
      - Hero sections
      - Service sections
      - CTA bands
      - Feature blocks
    rule: Use fluid display headings and fluid section spacing.

compositionRules:
  - A full-width section can use display scale for its heading while paragraph
    copy still uses the prose lane.
  - A blog post should not use display heading tokens for normal article
    hierarchy.
  - A card inside a full-width section still uses compact/interface spacing
    internally.
  - Prose width is controlled with ch units, not px.
  - Add a new token only when a reusable design need exists.

agentRules:
  - Classify the content context before selecting tokens.
  - Use lane tokens; do not invent raw font-size or spacing values.
  - Do not add breakpoint-specific type or spacing unless rendered evidence
    shows the intrinsic scale fails.
  - Use display/fluid scale only for large visual hierarchy, not normal reading
    content.
  - Use compact/static scale for blog posts and other reading surfaces.
  - Verify rendered line length for prose at real widths.

handoffExpectations:
  designAgent:
    mustReturn:
      - Selected usage lane per section/component.
      - Token names used for type, spacing, and measure.
      - Any intentional exception with rationale.
      - Rendered examples of foundations and components.
  implementationAgent:
    mustPreserve:
      - Token names.
      - Scale recipes.
      - ch-based prose measure.
      - clamp-based fluid sizing.

