  claude_agents: disabled
  codex_workflow_skills: generated_thin_adapter_to_agents_workflows
  codex_role_skills: generated_thin_adapter_to_agents_roles
  claude_hooks: generated_thin_adapter_to_agents_hooks
  codex_hooks: generated_thin_adapter_to_agents_hooks
  gemini_hooks: generated_thin_adapter_to_agents_hooks
  claude_scripts: disabled
  claude_skills: disabled

rules:
  - Use lowercase kebab-case for harness and .agents files controlled by this vault.
  - Preserve exact reserved names: AGENTS.md, CLAUDE.md, GEMINI.md, SKILL.md, DESIGN.md, README.md, LICENSE, CHANGELOG.md.
  - Runtime-specific folders are adapters, not sources of truth.
  - Claude-native role agents are disabled unless runtime-native subagent dispatch is re-approved.
  - Claude-local hook scripts are disabled; shared hook scripts live in .agents/hooks/scripts/.
  - Durable agent-operating knowledge belongs in harness/.
  - Secrets must not be stored in .agents/, harness/, root docs, or tracked manifests.
